name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: booking_app
          POSTGRES_PASSWORD: booking_ci_password
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking_app -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      # CI-only throwaway values; real secrets never live in the repository.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://booking_app:booking_ci_password@localhost:5432/booking
      HOLD_TTL_MINUTES: "10"
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (including concurrency tests)
        run: python -W error::DeprecationWarning manage.py test --verbosity 2
