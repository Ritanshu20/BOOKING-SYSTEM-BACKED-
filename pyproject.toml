[project]
name = "booking-backend"
version = "0.1.0"
description = "Seat booking backend that proves correctness under concurrent requests."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # Django-specific checks
    "SIM", # simplifications
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "bookings", "config", "core", "events", "payments"]
